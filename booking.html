<!DOCTYPE html>
<html lang="en-KE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book | Waridi Stays - Hotel Booking in Kenya.</title>
<link rel="stylesheet" href="style6.css">
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="#home">Waridi<span>Stays</span></a>
    <input type="checkbox" id="menu">
    <label class="burger" for="menu" aria-label="Toggle menu"></label>
    <nav class="links">
      <a href="index.html">Home</a>
      <a href="aboutus.html">About Us</a>
      <a href="rooms.html">Rooms</a>
      <a href="pricing.html">Pricing</a>
      <a href="design.html">Design</a>
      <a class="btn" href="#booking" style="color:#000;padding:9px 20px">Book Now</a>
    </nav>
  </div>
</header>

<!-- BOOKING -->
<section id="booking">
  <div class="wrap">
    <p class="eyebrow">Booking</p>
    <h2>Reserve your stay</h2>
    <p class="lead">Fill in the details below and we’ll confirm your reservation by email or WhatsApp.</p>
    <form action="#booking" method="post">
      <div><label for="name">Full name</label><input id="name" name="name" type="text" placeholder="Jane Doe" required></div>
      <div><label for="email">Email</label><input id="email" name="email" type="email" placeholder="jane@email.com" required></div>
      <div><label for="phone">Phone</label><input id="phone" name="phone" type="tel" placeholder="+254 700 000 000"></div>
      <div><label for="room">Room type</label>
        <select id="room" name="room"><option>Standard Room</option><option>Deluxe Room</option><option>Executive Suite</option></select></div>
      <div><label for="in">Check-in</label><input id="in" name="checkin" type="date" required></div>
      <div><label for="out">Check-out</label><input id="out" name="checkout" type="date" required></div>
      <div><label for="guests">Guests</label>
        <select id="guests" name="guests"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div>
      <div><label for="pkg">Package</label>
        <select id="pkg" name="package"><option>Essential</option><option>Comfort</option><option>Luxury</option></select></div>
      <div><label for="dest">Destination</label>
        <select id="dest" name="destination"><option>Nairobi</option><option>Mombasa</option><option>Diani</option><option>Maasai Mara</option><option>Naivasha</option><option>Nanyuki</option></select></div>
      <div><label for="pay">Preferred payment</label>
        <select id="pay" name="payment"><option>M-Pesa</option><option>Card</option><option>Pay on arrival</option></select></div>
      <div class="full"><label for="notes">Special requests</label><textarea id="notes" name="notes" rows="4" placeholder="Early check-in, quiet room, dietary needs…"></textarea></div>
      <div class="full"><button class="btn" type="submit">Confirm Booking</button></div>
    </form>
  </div>
</section>

<footer>
  <div class="wrap">© 2026 Waridi Stays · Nairobi, Kenya · +254 700 000 000 · hello@waridistays.co.ke · All rights reserved</div>
</footer>

</body>
</html>
</body>
</html>
